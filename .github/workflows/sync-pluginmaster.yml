name: Sync PluginMaster

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.0
        with:
          ref: master
          fetch-depth: 1

      - name: Sync PluginMaster
        run: |
          TARGET_FILE="DoubleWeaver/blob/PluginMaster.json"
          REMOTE_FILE="https://aonyx.ffxiv.wang/Plugin/PluginMaster"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          mkdir -p $(dirname "$TARGET_FILE")
          curl -sSL --connect-timeout 15 -A "$UA" "$REMOTE_FILE" -o "$TARGET_FILE.tmp"
          RET=$?
          echo "PluginMaster curl exit code: $RET"

          if [ $RET -eq 0 ] && [ -s "$TARGET_FILE.tmp" ]; then
            mv "$TARGET_FILE.tmp" "$TARGET_FILE"
            echo "✅ PluginMaster download success, updated"
          else
            rm -f "$TARGET_FILE.tmp"
            echo "⚠️ PluginMaster download invalid, keep old file"
          fi

      - name: Sync LightlessSync
        run: |
          TARGET_FILE="DoubleWeaver/blob/LightlessSync.json"
          REMOTE_FILE="https://dalamud_cn_3rd.otters.cloud/plugins/Lightless%20Sync"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          mkdir -p $(dirname "$TARGET_FILE")
          curl -sSL --connect-timeout 15 -A "$UA" "$REMOTE_FILE" -o "$TARGET_FILE.tmp"
          RET=$?
          echo "LightlessSync curl exit code: $RET"

          if [ $RET -eq 0 ] && [ -s "$TARGET_FILE.tmp" ]; then
            mv "$TARGET_FILE.tmp" "$TARGET_FILE"
            echo "✅ LightlessSync download success, updated"
          else
            rm -f "$TARGET_FILE.tmp"
            echo "⚠️ LightlessSync got error/empty, DO NOT touch original file"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add "DoubleWeaver/blob/PluginMaster.json"
          git add "DoubleWeaver/blob/LightlessSync.json"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes, skip commit"
            exit 0
          fi

          git commit -m "Auto Sync - $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git push origin master
          echo "✅ Sync finished"
